# CI for Haunted House (Requirement 9). Three independent jobs; any failing
# step fails its job and the run. No secrets are used.
name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Actions runs this as `bash --noprofile --norc -eo pipefail {0}`.
    shell: bash

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Check the tools the tests run
        # The .kiro, install-script and shellcheck tests skip without these.
        run: |
          for tool in git bash shellcheck; do
            command -v "$tool" || { echo "::error::$tool is not installed on this runner"; exit 1; }
          done
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: pytest
        # GitHub sets CI=true, so conftest.py loads the Hypothesis "ci" profile.
        run: pytest

  ui:
    name: UI tests and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # engines needs ^22.22.2 (jsdom 31). 22.23 is the line the bundle
          # build was checked on; patch releases only.
          node-version: '22.23'
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm --prefix app/ui ci
      - run: npm --prefix app/ui run typecheck
      - run: npm --prefix app/ui test
      - run: npm --prefix app/ui run build
      - name: Check bundle imports
        run: node scripts/check-bundle-imports.mjs
      - name: Check the committed bundle is up to date
        # Catches changed or deleted tracked files and new untracked chunks.
        run: |
          changes="$(git status --porcelain --untracked-files=all -- app/ui/dist)"
          stale=0
          git diff --exit-code --stat -- app/ui/dist || stale=1
          [[ -z "$changes" ]] || stale=1
          if (( stale )); then
            printf '%s\n' "$changes"
            files="$(printf '%s\n' "$changes" | cut -c4- | paste -sd ' ' -)"
            echo "::error title=Stale UI bundle::app/ui/dist differs from a fresh build: ${files}. Run 'npm --prefix app/ui run build' and commit app/ui/dist."
            exit 1
          fi
      - run: npm --prefix app/ui run build:replay

  repo:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: .kiro is not ignored
        run: scripts/check-kiro-tracked.sh
      - name: Secret scan
        run: python3 scripts/secret_scan.py
      - name: shellcheck
        run: |
          command -v shellcheck || { echo "::error::shellcheck is not installed on this runner"; exit 1; }
          shellcheck --version
          shellcheck scripts/*.sh
